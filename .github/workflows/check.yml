name: Skill regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real encryption and Nginx tools
        run: sudo apt-get update && sudo apt-get install -y age nginx openssl
      - name: Run regression and encryption integration tests
        env:
          SPD_REQUIRE_AGE: '1'
          SPD_REQUIRE_NGINX: '1'
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify privilege drop and real Nginx including port 80
        run: sudo env SPD_REQUIRE_AGE=1 SPD_REQUIRE_NGINX=1 PYTHONUTF8=1 "$(which python)" -m unittest discover -s tests -v
