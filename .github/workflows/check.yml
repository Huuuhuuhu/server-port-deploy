name: Skill regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real encryption and Nginx tools
        run: sudo apt-get update && sudo apt-get install -y age nginx openssl
      - name: Run regression and encryption integration tests
        env:
          SPD_REQUIRE_AGE: '1'
          SPD_REQUIRE_NGINX: '1'
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify privilege drop and real Nginx including port 80
        run: sudo env SPD_REQUIRE_AGE=1 SPD_REQUIRE_NGINX=1 PYTHONUTF8=1 "$(which python)" -m unittest discover -s tests -v
